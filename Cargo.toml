[package]
name = "url-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
dotenv = "0.15"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.11", features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
rayon = "1.7"  # 用于并行检查

[dev-dependencies]
tempfile = "3.8"